name: Release the Astro adapter

# astro-pail is published to npm on its own, with no tag: any push to main
# that changes what the package ships, its src folder or its package.json,
# releases it. A change to its tests or its README alone doesn't.
# scripts/npm-next-version picks the version: the one in package.json the
# first time, then the next patch each time after. To start a new minor or
# major, change package.json.
on:
  push:
    branches: [main]
    paths: ['adapters/astro/src/**', 'adapters/astro/package.json']

permissions:
  contents: read
  # For npm to record which commit and workflow a version was built by.
  id-token: write

# Two pushes close together publish one after the other, never both at once:
# each has to see the version the other took.
concurrency:
  group: release-astro
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/astro
    env:
      # An npm access token that may publish astro-pail. It is the
      # repository secret NPM_TOKEN.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: adapters/astro/pnpm-lock.yaml
      - name: Install the adapter's packages
        run: pnpm install --frozen-lockfile
      - name: Lint and test
        run: pnpm lint && pnpm test
      - name: Pick the version
        id: version
        run: echo "version=$("$GITHUB_WORKSPACE/scripts/npm-next-version" .)" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::There is no NPM_TOKEN secret, so astro-pail $VERSION can't be published. Add an npm access token that may publish it to the repository's secrets."
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --provenance
          echo "Published astro-pail $VERSION: https://www.npmjs.com/package/astro-pail/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.version.outputs.version }}
